# Render Blueprint for the API. See docs/DEPLOY.md.
services:
  - type: web
    name: generador-de-cv-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Same area as the Supabase project (AWS us-east-1).
    region: virginia
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # Supabase pooler, transaction mode (port 6543)
      - key: CORS_ORIGIN
        sync: false # URL of the Netlify site, e.g. https://generador-de-cv.netlify.app
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Netlify (proxy for /api) + Render's load balancer.
      - key: TRUST_PROXY
        value: '2'
      # The free instance has 512 MB of RAM.
      - key: PDF_MAX_CONCURRENT
        value: '1'
      - key: PDF_DISABLE_SANDBOX
        value: 'true'
